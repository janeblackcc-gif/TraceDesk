[tool.ruff]
target-version = "py311"
extend-exclude = ["artifacts", ".release-work"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
files = ["app/auth", "app/authz", "app/db/session.py", "app/services/errors.py", "app/models/profile.py", "app/models/factory.py", "app/models/vllm.py", "app/storage", "app/observability/logging.py"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["send2trash"]
ignore_missing_imports = true
